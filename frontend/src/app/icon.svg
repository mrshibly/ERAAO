<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ico-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565a0"/>
      <stop offset="100%" stop-color="#2196c8"/>
    </linearGradient>
    <linearGradient id="ico-grad-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e88c8"/>
      <stop offset="100%" stop-color="#42b4e6"/>
    </linearGradient>
    <linearGradient id="ico-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38a8d8"/>
      <stop offset="100%" stop-color="#6dd5f5"/>
    </linearGradient>
    <linearGradient id="ico-grad-stripe1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e88c8"/>
      <stop offset="100%" stop-color="#48c0e8"/>
    </linearGradient>
    <linearGradient id="ico-grad-stripe2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2196c8"/>
      <stop offset="100%" stop-color="#52c8ec"/>
    </linearGradient>
    <linearGradient id="ico-grad-stripe3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ba4d4"/>
      <stop offset="100%" stop-color="#5cd0f0"/>
    </linearGradient>
  </defs>

  <!-- A triangle - left leg -->
  <polygon points="256,40 80,460 160,460 256,165" fill="url(#ico-grad-dark)"/>

  <!-- A triangle - right leg -->
  <polygon points="256,40 432,460 352,460 256,165" fill="url(#ico-grad-light)"/>

  <!-- A triangle - top peak overlay for 3D depth -->
  <polygon points="256,40 220,130 292,130" fill="url(#ico-grad-mid)"/>

  <!-- Inner triangle hole (creates the A crossbar gap) -->
  <polygon points="256,180 200,310 312,310" fill="white"/>

  <!-- E stripe 1 (top) - cuts across left, extends right -->
  <polygon points="118,260 270,260 262,290 126,290" fill="url(#ico-grad-stripe1)"/>

  <!-- E stripe 2 (middle) - cuts across left -->
  <polygon points="104,330 254,330 246,360 112,360" fill="url(#ico-grad-stripe2)"/>

  <!-- E stripe 3 (bottom) - cuts across left -->
  <polygon points="88,400 236,400 230,430 95,430" fill="url(#ico-grad-stripe3)"/>

  <!-- Right side notch accent (sharp detail) -->
  <polygon points="345,290 372,245 380,260 353,305" fill="url(#ico-grad-light)"/>
</svg>
