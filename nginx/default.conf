# Eraao Nginx Reverse Proxy — Production
# Combines frontend + backend behind a single port 80/443

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:8000;
}

# Redirect HTTP → HTTPS (uncomment when SSL is configured)
# server {
#     listen 80;
#     server_name eraao.com www.eraao.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;  # Uncomment after setting up SSL
    server_name localhost eraao.com www.eraao.com _;

    # Docker internal DNS resolver — dynamically refreshes container IP changes
    resolver 127.0.0.11 valid=10s;

    # Max upload size (matches backend 50MB limit)
    client_max_body_size 50m;

    # SSL certificates (uncomment after Let's Encrypt setup)
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Gzip compression — saves bandwidth, faster page loads
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API routes → FastAPI backend
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # Health check endpoint
    location /healthz {
        proxy_pass http://backend_upstream;
    }

    # Everything else → Next.js frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Cache static assets aggressively
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
