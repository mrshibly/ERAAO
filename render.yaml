services:
  # ============================================================
  # 1. FastAPI Backend Web Service
  # ============================================================
  - type: web
    name: eraao-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile.prod
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: eraao-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://eraao-frontend.onrender.com,https://eraao.com,https://www.eraao.com

  # ============================================================
  # 2. Next.js Frontend Web Service
  # ============================================================
  - type: web
    name: eraao-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    plan: free
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        fromService:
          type: web
          name: eraao-backend
          property: host

databases:
  # ============================================================
  # 3. PostgreSQL Managed Database
  # ============================================================
  - name: eraao-db
    databaseName: eraao
    user: eraao
    plan: free
    region: singapore
