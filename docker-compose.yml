# ============================================================
# ERAAO Production Docker Compose — Optimized for Low RAM VPS
# Target: Hostinger KVM 1 (1 vCPU / 4 GB RAM / Singapore)
# ============================================================

services:
  # --- PostgreSQL (capped at 256MB shared_buffers) ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eraao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eraao_secure_pw_change_me}
      POSTGRES_DB: eraao
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c effective_cache_size=512MB
        -c max_connections=50
        -c wal_buffers=4MB
        -c checkpoint_completion_target=0.9
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eraao"]
      interval: 10s
      retries: 5
      start_period: 10s

  # --- Redis (capped at 64MB) ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 48mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # --- FastAPI Backend (single worker, ~150MB) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://eraao:${POSTGRES_PASSWORD:-eraao_secure_pw_change_me}@postgres:5432/eraao
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      ALLOWED_ORIGINS: https://eraao.com,https://www.eraao.com
      ENVIRONMENT: production
      DEBUG: "false"
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Next.js Frontend (standalone, ~120MB) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - backend

  # --- Nginx Reverse Proxy (~10MB) ---
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          memory: 32M
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
